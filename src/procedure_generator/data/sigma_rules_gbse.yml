title: PE Execution from User-Writable Temp Path or BlackCat Token Arguments
id: d4af6874-6ffe-4909-8982-e7a656ac0303
name: W25
status: experimental
description: >
  Detects execution of a PE from a user-writable staging directory including
  AppData\Local\Temp (extends W15, which omitted AppData\Local\Temp), or any
  process invoked with the ALPHV/BlackCat encryptor argument pair --access-
  token / --no-prop-flags.
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/09
tags:
  - attack.execution
  - attack.impact
  - attack.t1059.001
  - attack.t1486
logsource:
  product: windows
  category: process_creation
detection:
  selection_temp_pe:
    Image|contains:
      - '\\AppData\\Local\\Temp\\'
      - '\\Windows\\Temp\\'
      - '\\Users\\Public\\'
      - '\\ProgramData\\'
    Image|endswith: '.exe'
  selection_blackcat:
    CommandLine|contains:
      - '--access-token'
      - '--no-prop-flags'
  condition: 1 of selection_*
falsepositives:
  - Portable applications legitimately executed from a user profile temp directory
level: high
x-gbse-telemetry: [file, network, process]
x-gbse-steps: [27]

