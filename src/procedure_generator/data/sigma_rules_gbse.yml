title: External Remote Services Enablement or Exposure (RDP/SSH)
id: e722d390-7581-4595-a336-cad450f91ded
name: W29
status: experimental
description: >
  Coverage rule R17 (gold-control gap, T1133): detects enabling or exposing
  external remote services - turning on RDP via fDenyTSConnections=0, opening
  TCP 3389 in the firewall, or starting the sshd service - the technique
  present at gold-control step 1 that the 29-step Linux variant reassigns to
  T1048.003 and therefore omits from the per-step library.
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/09
tags:
  - attack.initial_access
  - attack.persistence
  - attack.t1133
logsource:
  product: windows
  category: process_creation
detection:
  selection_rdp_reg:
    Image|endswith:
      - '\\reg.exe'
      - '\\powershell.exe'
    CommandLine|contains|all:
      - 'fDenyTSConnections'
      - '0'
  selection_fw_rdp:
    Image|endswith: '\\netsh.exe'
    CommandLine|contains:
      - '3389'
      - 'RemoteDesktop'
  selection_sshd:
    Image|endswith:
      - '\\sc.exe'
      - '\\powershell.exe'
    CommandLine|contains|all:
      - 'sshd'
      - 'start'
  condition: 1 of selection_*
falsepositives:
  - Administrators enabling RDP or SSH for sanctioned remote access
level: high
x-gbse-telemetry: [identity, network, process]
x-gbse-steps: []

