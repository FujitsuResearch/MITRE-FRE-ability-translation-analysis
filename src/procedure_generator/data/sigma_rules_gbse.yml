title: Credentials from Password Stores Access
id: ce41f635-5c76-4752-9cd2-8da70883bec6
name: W30
status: experimental
description: >
  Coverage rule R18 (gold-control gap, T1555): detects access to OS or browser
  credential stores - vaultcmd /list, Credential Manager via rundll32
  keymgr.dll, PowerShell credential enumeration, or reads of browser Login
  Data / Local State - the technique present at gold-control step 7 that the
  29-step Linux variant reassigns to T1018 and therefore omits from the per-
  step library.
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/09
tags:
  - attack.credential_access
  - attack.t1555
  - attack.t1555.003
logsource:
  product: windows
  category: process_creation
detection:
  selection_vaultcmd:
    Image|endswith: '\\vaultcmd.exe'
    CommandLine|contains: '/list'
  selection_credman:
    Image|endswith:
      - '\\rundll32.exe'
      - '\\powershell.exe'
    CommandLine|contains:
      - 'keymgr.dll'
      - 'CredEnumerate'
      - 'Get-StoredCredential'
      - 'vault::cred'
  selection_browser:
    CommandLine|contains:
      - '\\Login Data'
      - '\\Local State'
      - '\\Web Data'
  condition: 1 of selection_*
falsepositives:
  - Password managers or backup tooling legitimately reading credential stores
level: high
x-gbse-telemetry: [file, identity, process]
x-gbse-steps: []
