title: systemctl Security Service Stop and Disable
id: f7755807-6060-4660-b62f-4b8f7130be64
name: L09
status: experimental
description: >
  Detects systemctl stopping or disabling host security services (firewall,
  AV, IDS), the Linux equivalent of `sc stop` / `Set-MpPreference -Disable`.
  Procedure S13: systemctl stop firewalld && systemctl disable firewalld (T1562.001).
  Procedure S14: systemctl stop clamav-freshclam && disable (T1562.001).
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/05
tags:
  - attack.defense_evasion
  - attack.t1562.001
logsource:
  product: linux
  category: process_creation
detection:
  selection_firewall:
    Image|endswith: '/systemctl'
    CommandLine|contains:
      - 'stop firewalld'
      - 'disable firewalld'
      - 'stop ufw'
      - 'disable ufw'
      - 'stop iptables'
  selection_av:
    Image|endswith: '/systemctl'
    CommandLine|contains:
      - 'stop clamav'
      - 'disable clamav'
      - 'stop apparmor'
      - 'disable apparmor'
      - 'stop fail2ban'
      - 'stop aide'
  condition: 1 of selection_*
falsepositives:
  - Planned firewall maintenance by system administrators
level: high
x-gbse-telemetry: [process]
x-gbse-steps: [13, 14]

