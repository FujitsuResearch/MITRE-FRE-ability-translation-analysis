title: SSH Interactive Bash Login Shell Used for Lateral Movement
id: c84f56d2-3af2-4f3c-9d82-b1f7e3a2cd4e
name: L03
status: experimental
description: >
  Detects SSH client spawning a bash -l (login) or bash shell interactively
  on a remote host, a pattern typical of adversary lateral movement via
  compromised credentials.
  Procedure S3: ssh user@10.30.10.4 "bash -l"; S4: ssh windesk@10.20.20.11
  "sudo -i"; S10: ssh user@10.20.10.122 "bash -l" (T1021.001).
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/05
tags:
  - attack.lateral_movement
  - attack.t1021.001
  - attack.initial_access
logsource:
  product: linux
  category: process_creation
detection:
  selection_bash_shell:
    Image|endswith: '/ssh'
    CommandLine|contains:
      - '"bash -l"'
      - '"bash -s"'
      - '"sudo -i"'
      - '"sudo bash"'
  selection_sudo_remote:
    Image|endswith: '/ssh'
    CommandLine|contains|all:
      - '-t '
      - 'sudo'
  condition: 1 of selection_*
falsepositives:
  - Legitimate system administration using interactive SSH
level: medium
x-gbse-telemetry: [identity, network, process]
x-gbse-steps: [3, 4, 10]

