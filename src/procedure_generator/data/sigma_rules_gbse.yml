name: L14
status: experimental
description: >
  Detects scp transferring payloads from /tmp to multiple remote internal hosts
  in sequence, characteristic of ransomware staging across a compromised network
  using admin credentials (Windows Admin Shares equivalent via SSH).
  Procedure S20: for host in ...; do scp /tmp/collector1.exe host:/tmp/ ... (T1077).
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/05
tags:
  - attack.lateral_movement
  - attack.t1077
logsource:
  product: linux
  category: process_creation
detection:
  selection_tmp_deploy:
    Image|endswith: '/scp'
    CommandLine|contains:
      - '/tmp/collector'
      - '/tmp/digirevenge'
      - '/tmp/netbnmp'
  selection_batch_pattern:
    Image|endswith: '/scp'
    CommandLine|contains|all:
      - '/tmp/'
      - '.exe'
      - '/tmp/'
  condition: 1 of selection_*
falsepositives:
  - Legitimate configuration management deployment (Ansible, Fabric)
level: high
x-gbse-telemetry: [file, identity, network, process]
