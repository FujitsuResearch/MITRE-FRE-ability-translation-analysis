  product: windows
  category: process_creation
detection:
  selection_stealer:
    Image|endswith:
      - '\\netbnmp.exe'
      - '\\stealer.exe'
      - '\\infostealer.exe'
    CommandLine|contains: 'base64'
  selection_behaviour:
