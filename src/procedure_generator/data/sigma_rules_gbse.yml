  nmap step; the binary-scanner rule W13 (nmap/masscan/zmap/arp-scan .exe)
  does not match a PowerShell cmdlet.
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/09
tags:
  - attack.discovery
  - attack.t1046
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\\powershell.exe'
    CommandLine|contains:
      - 'Invoke-Portscan'
      - 'Invoke-ArpScan'
      - 'Invoke-PortScan'
  condition: selection
falsepositives:
  - Authorised internal vulnerability scanning using PowerShell tooling
level: medium
x-gbse-telemetry: [network, process]
x-gbse-steps: [19]

