title: sysctl Kernel Security Parameter Modification
id: 6b00cd98-89e3-458c-9ed7-10af8c451609
name: L10
status: experimental
description: >
  Detects sysctl used to disable kernel security features (ASLR, ptrace
  restrictions, perf paranoia), the Linux analogue of registry modifications
  that weaken exploit mitigations.
  Procedure S15: sysctl -w kernel.randomize_va_space=0 (T1112).
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/05
tags:
  - attack.defense_evasion
  - attack.t1112
logsource:
  product: linux
  category: process_creation
detection:
  selection_aslr:
    Image|endswith: '/sysctl'
    CommandLine|contains: 'kernel.randomize_va_space=0'
  selection_ptrace:
    Image|endswith: '/sysctl'
    CommandLine|contains:
      - 'kernel.yama.ptrace_scope=0'
      - 'kernel.perf_event_paranoid=-1'
  condition: 1 of selection_*
falsepositives:
  - Kernel tuning scripts, security benchmark hardening scripts that restore defaults
level: high
x-gbse-telemetry: [file, process]
x-gbse-steps: [15]

