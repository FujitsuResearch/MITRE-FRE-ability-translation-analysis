title: PowerShell Get-ChildItem Admin-Share File Discovery
id: 2f3152e4-b0e7-4aa2-aaa4-5284ee8b2758
name: W28
status: experimental
description: >
  Detects PowerShell Get-ChildItem (gci/dir alias) enumerating files on an
  administrative share (C$\Windows\System32) or targeting known log artefacts.
  Equivalent of the Linux file-discovery step; the cmd.exe/robocopy rule W18
  does not match the PowerShell cmdlet.
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/09
tags:
  - attack.discovery
  - attack.t1083
  - attack.t1135
logsource:
  product: windows
  category: process_creation
detection:
  selection_gci:
    Image|endswith: '\\powershell.exe'
    CommandLine|contains:
      - 'Get-ChildItem'
      - 'gci '
      - '-Path '
  selection_target:
    CommandLine|contains:
      - 'C$\\'
      - 'clog.xtlog'
      - 'bc.log'
