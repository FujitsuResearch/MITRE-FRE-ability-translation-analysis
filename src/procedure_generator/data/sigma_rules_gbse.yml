title: wget Executable Binary Download to Staging Path
id: a2c4d601-7f3e-4b19-8c47-f9b1e2a3dd5c
name: L07
status: experimental
description: >
  Detects wget downloading PE executables (.exe) or unknown binaries directly
  to /tmp or /dev/shm staging paths from external URLs. ALPHV/BlackCat uses
  this pattern to stage InfoStealer (netbnmp.exe), ExMatter (collector1.exe),
  and BlackCat Linux/Windows ransomware (digirevenge/digirevenge.exe).
  Procedure S8,S11,S18,S22,S26: wget http://theinator.com/digirevenge/... (T1105).
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/05
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  product: linux
  category: process_creation
detection:
  selection_pe_download:
    Image|endswith: '/wget'
    CommandLine|contains: '.exe'
  selection_pe_download_paths:
    Image|endswith: '/wget'
    CommandLine|contains:
      - '-O /tmp/'
      - '-O /dev/shm/'
      - '-P /tmp'
  selection_known_domain:
    Image|endswith: '/wget'
    CommandLine|contains: 'theinator.com'
  selection_staging_no_ext:
    Image|endswith: '/wget'
    CommandLine|contains|all:
      - '-O /tmp/'
      - 'http'
  condition: 1 of selection_*
falsepositives:
  - Legitimate package downloads via wget in CI/CD pipelines
level: high
x-gbse-telemetry: [file, network, process]
x-gbse-steps: [8, 11, 18, 22, 26]

