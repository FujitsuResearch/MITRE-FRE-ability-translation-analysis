title: rclone WebDAV Server Started on Windows Host
id: aa3b5d9f-112e-4c88-a7f1-cb82b1e5cc31
name: W01
status: experimental
description: >
  Detects rclone.exe started in WebDAV server mode on Windows, binding to
  a non-loopback address. Windows equivalent of Linux S1 (T1048.003).
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/05
tags:
  - attack.exfiltration
  - attack.t1048.003
  - attack.command_and_control
logsource:
  product: windows
  category: process_creation
detection:
  selection:
    Image|endswith: '\rclone.exe'
    CommandLine|contains|all:
      - 'serve'
      - 'webdav'
  filter_loopback:
    CommandLine|contains:
      - '--addr 127.'
      - '--addr ::1'
  condition: selection and not filter_loopback
falsepositives:
  - Legitimate rclone WebDAV use for cloud sync operations
level: high
x-gbse-telemetry: [file, network, process]
x-gbse-steps: [1]

