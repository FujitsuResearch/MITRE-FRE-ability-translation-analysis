title: C2 Framework or RAT Binary Executed from Non-Standard Directory
id: 67ad2295-1026-4a94-b64c-411e9735e29d
name: W02
status: experimental
description: >
  Detects execution of a controller binary or tool server from a non-standard
  path (not Program Files, Windows, or System32). Windows equivalent of S2 (T1105).
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/05
tags:
  - attack.command_and_control
  - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection_staging_paths:
    Image|contains:
      - '\Users\Public\'
      - '\Windows\Temp\'
      - '\ProgramData\'
      - '\AppData\Local\Temp\'
    Image|endswith:
      - 'Server.exe'
      - 'Controller.exe'
      - 'Handler.exe'
  condition: selection_staging_paths
falsepositives:
  - Legitimate portable applications run from user directories
