  dumping arguments (base64, dpapi, localhost, zorimoto), characteristic of
  the ALPHV/BlackCat InfoStealer (netbnmp.exe).
  Procedure S9: wine /tmp/netbnmp.exe base64 localhost zorimoto ... (T1003.001).
  Procedure S12: wine /tmp/netbnmp.exe dpapi localhost ... (T1003.001).
author: Ahmed Elmesiry, Fujitsu Research of Europe
date: 2026/06/05
tags:
  - attack.credential_access
  - attack.t1003.001
  - attack.execution
  - attack.t1204.002
logsource:
  product: linux
  category: process_creation
detection:
  selection_cred_args:
    Image|endswith: '/wine'
    CommandLine|contains:
      - 'dpapi'
      - 'base64'
      - 'zorimoto'
  selection_tmp_pe:
    Image|endswith: '/wine'
    CommandLine|contains|all:
      - '/tmp/'
      - '.exe'
  condition: 1 of selection_*
falsepositives:
  - Legitimate Wine applications running from /tmp (rare in production)
level: critical
x-gbse-telemetry: [identity, process]
x-gbse-steps: [9, 12]

