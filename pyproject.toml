[project]
name = "fre-research"
version = "0.1.0"
description = "LLM-based adversary procedure transformation framework"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai",
    "python-dotenv",
    "pydantic>=2.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.1.0",
    "httpx",
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
procedure-generator = "procedure_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/procedure_generator"]

# Ship the GBSE data directory (non-.py resources: Sigma rule library and the
# optional default gbse_config.json) inside the wheel so the package-relative
# Path(__file__).parent / "data" / ... lookups resolve after install.
[tool.hatch.build.targets.wheel.force-include]
"src/procedure_generator/data" = "procedure_generator/data"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
