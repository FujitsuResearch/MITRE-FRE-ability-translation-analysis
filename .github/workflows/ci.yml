# GitHub Actions CI.
# Mirrors the two gates from .gitlab-ci.yml:
#   * validate -- pre-commit hooks (lint, formatting, secret scan)
#   * test     -- the pytest suite (Tier 1-3), via uv
# Runs on pushes to main and on every pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node is needed for the markdownlint-cli2 hook.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        env:
          # no-commit-to-branch guards against local commits to main; in CI we
          # legitimately run on main after merges, so skip just that hook.
          SKIP: no-commit-to-branch
        run: uvx pre-commit run --all-files --show-diff-on-failure

  test:
    name: test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sync dependencies (incl. dev group)
        run: uv sync

      - name: Run tests
        run: uv run pytest -q --junitxml=report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: report.xml
          retention-days: 7
